services:
  hongguo-dl:
    build:
      context: ./docker
    image: hongguo-dl:local
    container_name: hongguo-dl
    restart: "no"
    ports:
      - "127.0.0.1:8800:8080"
    environment:
      APP_PASSWORD: ${APP_PASSWORD:?Set APP_PASSWORD in .env}
      DOWNLOAD_DIR: /downloads
    volumes:
      - ./downloads:/downloads
